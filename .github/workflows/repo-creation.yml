name: Repository Creation Automation

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Enter the new repository name"
        required: true
        type: string

jobs:
  create-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Create repository and setup files
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e

          REPO_NAME="${{ inputs.repo_name }}"
          ORG="repo-automation-org"
          TEAM="team-a"

          echo "Creating repository: $REPO_NAME"

          # Authenticate GitHub CLI with the token
          gh auth setup-git

          # Create private repository
          gh repo create "$ORG/$REPO_NAME" --private

          echo "Repository created successfully"

          # Add Team-A with Read permission
          gh api --method PUT \
            "/orgs/$ORG/teams/$TEAM/repos/$ORG/$REPO_NAME" \
            -f permission=pull

          echo "Team-A added with Read permission"

          # Clone the newly created repository
          gh repo clone "$ORG/$REPO_NAME"

          # Go inside repository
          cd "$REPO_NAME"

          # Copy template files
          cp "$GITHUB_WORKSPACE/template-files/"* .

          # Configure Git
          git config user.name "udsinghh"
          git config user.email "uditisingh1999@gmail.com"

          # Create main branch
          git branch -M main

          # Add and commit files
          git add .
          git commit -m "Add template files"

          # Push files
          git push -u origin main

          echo "Repository setup completed successfully"
