name: Repository Creation Automation

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Enter the new repository name"
        required: true
        type: string

jobs:
  create-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Run repository creation script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash scripts/create-repo.sh "${{ inputs.repo_name }}"
